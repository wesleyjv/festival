events {
    
}
http {
    include /etc/nginx/mime.types;

    # Compress text responses before sending to clients
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json application/x-javascript text/xml application/xml
               application/xml+rss image/svg+xml;

    server {
        listen 80 default_server;
        root /app/public;

        client_max_body_size 20M;

        index index.php index.html index.htm;

        # Front controller: do not use $uri/ here — an empty directory (e.g. /admin/)
        # would otherwise yield 403 instead of routing to index.php.
        location / {
            try_files $uri /index.php?$args;
        }

        # Cache static assets in the browser for 30 days
        location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        location ~ \.php$ {
            fastcgi_pass php:9000;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include fastcgi_params;

            # Buffer responses so nginx streams them efficiently to slow clients
            fastcgi_buffering on;
            fastcgi_buffers 16 16k;
            fastcgi_buffer_size 32k;
        }
    } 
}
